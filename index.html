<!doctype html>
<html lang="zh-CN">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>芯片进化局 · 合成电子科大</title>
  <style>
    :root{color-scheme:dark;--bg:#0b1326;--panel:#14213b;--line:#314265;--text:#f6f7fc;--muted:#99a9c7;--cyan:#72def4;--orange:#ffad65;--red:#ff7288}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100svh;-webkit-text-size-adjust:100%;overscroll-behavior-y:contain;background:radial-gradient(ellipse at 48% -20%,#1b355a 0,transparent 53%),linear-gradient(150deg,#0b1326,#0a1020 70%);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}button{font:inherit;cursor:pointer;touch-action:manipulation}
    .app{max-width:1130px;margin:0 auto;padding:22px 20px 30px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:13px}.brand-mark{width:50px;height:50px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(145deg,#19355a,#113755);border:1px solid #3f7792;box-shadow:0 0 20px #42cbea20;color:var(--cyan);font-size:26px;font-weight:900}.eyebrow{display:block;color:var(--cyan);font-size:10px;font-weight:800;letter-spacing:.2em;text-transform:uppercase}h1{margin:1px 0 0;font-size:25px;line-height:1.15;letter-spacing:.04em}.subtitle{margin:4px 0 0;color:var(--muted);font-size:12px}.actions{display:flex;gap:8px}.icon-btn{min-width:44px;height:42px;border:1px solid var(--line);border-radius:12px;color:var(--text);background:#1a2a48;transition:background .18s,transform .18s}.icon-btn:hover{background:#294166;transform:translateY(-2px)}.icon-btn:focus-visible,.primary-btn:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
    .layout{display:grid;grid-template-columns:215px minmax(0,480px) 235px;justify-content:center;gap:18px;align-items:start}.panel,.arena-shell{background:linear-gradient(150deg,#192744,#111c33);border:1px solid #354766;border-radius:20px;box-shadow:0 18px 45px #0004,inset 0 1px #ffffff0d}.panel{padding:18px}.panel h2{margin:0 0 14px;color:#e5eeff;font-size:13px;letter-spacing:.08em}
    .score-card{position:relative;overflow:hidden;padding:17px;border:1px solid #3e6180;border-radius:15px;background:linear-gradient(140deg,#214c68,#173657 60%,#182b4b)}.score-card:after{content:"";position:absolute;width:130px;height:130px;right:-70px;top:-65px;border:1px solid #7fe6fa55;border-radius:50%;box-shadow:0 0 0 20px #7fe6fa0a,0 0 0 40px #7fe6fa08}.label{display:block;color:#a9c7dc;font-size:11px;font-weight:700;letter-spacing:.1em}.score{display:block;margin:5px 0 3px;font-size:40px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}.best{color:#c5d9e8;font-size:12px}.best strong{color:#fff}.mini-rule{height:1px;background:#ffffff1a;margin:18px 0}.preview-card{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid #304e6c;border-radius:14px;background:#0e213d}.preview-orb{width:56px;height:56px;flex:none;display:grid;place-items:center;border-radius:50%;background:radial-gradient(circle at 30% 20%,#2c6786,#122341 70%);border:2px solid #62cee4;box-shadow:0 0 18px #61d6f92b}.preview-orb img{width:43px;height:43px;object-fit:contain}.preview-name{font-size:14px;font-weight:800}.preview-hint{color:var(--muted);font-size:11px}.howto{margin-top:17px;color:var(--muted);font-size:12px}.howto p{margin:8px 0}.key{display:inline-block;min-width:22px;padding:1px 5px;border:1px solid #58718f;border-radius:5px;color:#e7f4ff;text-align:center}
    .arena-shell{padding:9px;position:relative}.arena-head{display:flex;justify-content:space-between;align-items:center;min-height:33px;padding:2px 12px 8px;color:#9eb4d0;font-size:11px;font-weight:700;letter-spacing:.1em}.status{display:flex;align-items:center;gap:7px}.status-dot{width:7px;height:7px;border-radius:50%;background:#4fe0bb;box-shadow:0 0 9px #4fe0bb}.status.danger{color:#ffc1a6}.status.danger .status-dot{background:var(--red);box-shadow:0 0 9px var(--red)}.arena{position:relative;overflow:hidden;border:1px solid #426589;border-radius:15px;background:#0d1a30;touch-action:none;cursor:crosshair}canvas{display:block;width:100%;height:auto;aspect-ratio:460/630}.arena-foot{display:flex;align-items:center;justify-content:space-between;padding:9px 11px 2px;color:#a2b4d0;font-size:11px}#combo{color:#ffcb78;font-weight:800;min-height:16px}
    .progress-list{display:grid;gap:8px}.tier{display:flex;align-items:center;gap:10px;min-height:54px;padding:6px 8px;border:1px solid #344563;border-radius:12px;background:#111e36;transition:border-color .2s,background .2s}.tier.reached{border-color:#4c7991;background:#172b47}.tier.current{box-shadow:inset 3px 0 var(--cyan)}.tier-icon{width:39px;height:39px;flex:none;object-fit:contain;filter:drop-shadow(0 2px 3px #0008)}.tier.locked .tier-icon{filter:grayscale(1);opacity:.38}.tier-num{color:var(--cyan);font-size:10px;font-weight:800;letter-spacing:.06em}.tier.locked .tier-num{color:#788baa}.tier-name{font-size:12px;font-weight:750}.tier.locked .tier-name{color:#7f91ac}.legend{margin-top:13px;color:#8fa5c1;font-size:11px;text-align:center}
    .overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:22px;background:#08152add;backdrop-filter:blur(5px);text-align:center}.overlay.show{display:flex}.overlay-card{width:min(310px,100%);padding:28px 18px;border:1px solid #5b7998;border-radius:19px;background:linear-gradient(160deg,#1e3555,#11233e);box-shadow:0 18px 60px #0009}.overlay-icon{font-size:35px;color:var(--orange)}.overlay h2{margin:4px 0 7px;font-size:27px}.overlay p{margin:0 0 20px;color:#bdcde1;font-size:13px}.primary-btn{min-width:145px;padding:10px 16px;border:0;border-radius:10px;background:linear-gradient(110deg,#68def1,#91eabf);color:#112039;font-weight:900;box-shadow:0 6px 20px #52e3da36}.primary-btn:hover{filter:brightness(1.08)}.footer{text-align:center;margin-top:17px;color:#647b9a;font-size:11px}
    @media(max-width:960px){.layout{grid-template-columns:180px minmax(0,480px)}.progress-panel{grid-column:1/-1}.progress-list{grid-template-columns:repeat(4,1fr)}}
    @media(max-width:700px){
      .app{padding:10px 10px 18px;padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
      .topbar{gap:8px;margin-bottom:10px}.brand{gap:8px;min-width:0}.brand>div:last-child{min-width:0}.brand-mark{width:42px;height:42px;flex:none;font-size:22px}
      .eyebrow{font-size:9px;letter-spacing:.08em}h1{font-size:20px}.subtitle{display:none}.actions{gap:4px;flex:none}.icon-btn{min-width:44px;height:44px;padding:0}
      .layout{display:flex;flex-direction:column;gap:8px}.panel,.arena-shell{width:100%}.score-panel{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:8px}
      .score-panel h2,.score-panel .mini-rule,.score-panel .howto{display:none}.score-card{padding:8px 10px}.score{font-size:26px;font-size:clamp(22px,6.5vw,30px)}.next-wrap{min-width:0}
      .preview-card{height:100%;padding:8px;gap:6px}.preview-orb{width:40px;height:40px}.preview-orb img{width:32px;height:32px}.preview-name{font-size:12px}.preview-hint{font-size:10px}
      .arena-shell{max-width:480px;align-self:center}.arena,.icon-btn,.primary-btn{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
      .arena-head{padding-left:6px;padding-right:6px;letter-spacing:.04em}.arena-foot{gap:6px;padding-left:6px;padding-right:6px}
      .progress-panel{padding:10px}.progress-panel h2{margin:0 0 8px}.progress-list{grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}.tier{display:block;text-align:center;min-height:75px;padding:4px 2px}.tier-icon{width:32px;height:32px}.tier-name{font-size:10px}.tier-num{font-size:9px}.legend{margin:7px 0 0}
    }
    @media(max-width:385px){.eyebrow{display:none}.brand{gap:7px}.brand-mark{width:38px;height:38px}h1{font-size:19px}}
    /* 棋盘仍保持460:630比例，短屏优先保证游戏区域可见。 */
    @supports(height:100svh){
      @media(max-width:700px) and (orientation:portrait){
        .arena-shell{width:min(100%,max(240px,calc((100svh - 270px - env(safe-area-inset-top) - env(safe-area-inset-bottom)) * .730159 + 22px)))}
      }
    }
    @media(max-width:960px) and (max-height:500px) and (orientation:landscape){
      .app{padding:8px 10px 16px;padding:max(8px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
      .topbar{gap:8px;margin-bottom:8px}.brand-mark{width:40px;height:40px;flex:none}.subtitle{display:none}.icon-btn{min-width:44px;height:44px;padding:0}
      .layout{display:grid;grid-template-columns:minmax(130px,180px) minmax(0,480px);gap:12px}
      .score-panel{display:block;padding:10px}.score-panel h2,.mini-rule,.howto{display:none}.score-card{padding:8px 10px}.score{font-size:26px}.next-wrap{margin-top:12px}.preview-card{padding:8px;gap:6px}.preview-name{font-size:12px}.preview-hint{font-size:10px}
      .arena-shell{width:100%;justify-self:center;align-self:start}.progress-panel{grid-column:1/-1}
    }
    @supports(height:100svh){
      @media(max-width:960px) and (max-height:500px) and (orientation:landscape){
        .arena-shell{width:min(100%,max(180px,calc((100svh - 155px - env(safe-area-inset-top) - env(safe-area-inset-bottom)) * .730159 + 22px)))}
      }
    }
  </style>

    for (let y = 24; y < H; y += 35) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

    glow.addColorStop(0, '#61bfff1c'); glow.addColorStop(1, '#61bfff00');
    ctx.fillStyle = glow; ctx.fillRect(0, 0, W, 360);
    ctx.fillStyle = '#7feaff13'; ctx.fillRect(0, FLOOR, W, H - FLOOR);
    ctx.strokeStyle = '#71cee492'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(LEFT, FLOOR); ctx.lineTo(RIGHT, FLOOR); ctx.stroke();
    ctx.strokeStyle = '#5dbad05c'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(LEFT, 0); ctx.lineTo(LEFT, FLOOR); ctx.moveTo(RIGHT, 0); ctx.lineTo(RIGHT, FLOOR); ctx.stroke();
    ctx.strokeStyle = warning > 0 ? '#ff7b8f' : '#e6a271a1';
    ctx.lineWidth = warning > 0 ? 3 : 1.5; ctx.setLineDash([8, 7]);
    ctx.beginPath(); ctx.moveTo(LEFT + 2, DANGER); ctx.lineTo(RIGHT - 2, DANGER); ctx.stroke(); ctx.setLineDash([]);
    ctx.font = 'bold 10px system-ui'; ctx.fillStyle = warning > 0 ? '#ffabb8' : '#b8a5a2';
    ctx.fillText('警戒线', LEFT + 9, DANGER - 9);
    ctx.textAlign = 'right'; ctx.fillStyle = '#89b4c7'; ctx.fillText('DROP ZONE', RIGHT - 9, 20); ctx.textAlign = 'left';
  }
  function drawOrb(x, y, level, angle = 0, squash = 0, scale = 1, alpha = 1) {
    const { rx, ry } = axesFor(level), color = colors[level];
    ctx.save(); ctx.globalAlpha = alpha; ctx.translate(x, y); ctx.rotate(angle);
    ctx.scale(scale * (1 + squash * 0.5), scale * (1 - squash * 0.65));
    ctx.shadowColor = color; ctx.shadowBlur = level >= 7 ? 20 : 11;
    const fill = ctx.createRadialGradient(-rx * 0.35, -ry * 0.5, Math.min(rx, ry) * 0.07, 0, 0, Math.max(rx, ry));
    fill.addColorStop(0, '#456d93'); fill.addColorStop(0.5, '#213d61'); fill.addColorStop(1, '#11263f');
    ctx.fillStyle = fill; ctx.beginPath(); ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0; ctx.strokeStyle = color; ctx.lineWidth = Math.max(2, Math.min(rx, ry) * 0.052); ctx.stroke();
    ctx.strokeStyle = '#ffffff73'; ctx.lineWidth = Math.max(1, Math.min(rx, ry) * 0.035);
    ctx.beginPath(); ctx.ellipse(0, 0, rx * 0.82, ry * 0.82, 0, Math.PI * 1.12, Math.PI * 1.65); ctx.stroke();
    const image = images[level];
    if (image?.complete && image.naturalWidth) {
      const factor = level === 8 ? 1.65 : 1.49;
      const boxWidth = rx * factor, boxHeight = ry * factor;
      const imageScale = Math.min(boxWidth / image.naturalWidth, boxHeight / image.naturalHeight);
      const imageWidth = image.naturalWidth * imageScale, imageHeight = image.naturalHeight * imageScale;
      ctx.save(); ctx.beginPath(); ctx.ellipse(0, 0, rx * 0.8, ry * 0.8, 0, 0, Math.PI * 2); ctx.clip();
      ctx.drawImage(image, -imageWidth / 2, -imageHeight / 2, imageWidth, imageHeight); ctx.restore();
    } else {
      ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = `bold ${Math.max(15, Math.min(rx, ry) * 0.7)}px system-ui`;
      ctx.fillText(String(level), 0, 1);
    }
    ctx.restore();
  }
  function drawAim() {
    if (ended || paused) return;
    const { rx, ry } = axesFor(current), halfWidth = rx, halfHeight = ry;
    const x = clamp(aimX, LEFT + halfWidth, RIGHT - halfWidth);
    ctx.save(); ctx.strokeStyle = '#a9edff68'; ctx.lineWidth = 1.5; ctx.setLineDash([5, 9]);
    ctx.beginPath(); ctx.moveTo(x, 64 + halfHeight); ctx.lineTo(x, FLOOR); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = '#8fe7f340'; ctx.beginPath(); ctx.ellipse(x, FLOOR - 3, rx * 1.3, 5, 0, 0, Math.PI * 2); ctx.fill();
    drawOrb(x, 61, current, 0, 0, 1 + Math.sin(elapsed * 4) * 0.025, cooldown > 0 ? 0.48 : 0.96);
    ctx.restore();
  }
  function drawEffects() {
    for (const ring of rings) {
      ctx.globalAlpha = ring.life / ring.ttl;
      ctx.strokeStyle = ring.color; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(ring.x, ring.y, ring.r, 0, Math.PI * 2); ctx.stroke();
    }
    for (const p of particles) {
      ctx.globalAlpha = clamp(p.life / p.ttl, 0, 1);
      ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
    }
    ctx.textAlign = 'center'; ctx.font = '900 21px system-ui';
    for (const label of labels) {
      ctx.globalAlpha = label.life / label.ttl;
      ctx.fillStyle = label.color; ctx.fillText(label.text, label.x, label.y);
    }
    ctx.globalAlpha = 1; ctx.textAlign = 'left';
  }
  function render() {
    ctx.clearRect(0, 0, W, H);
    drawBackground();
    drawAim();
    for (const b of balls) {
      const scale = b.pop > 0 ? 1 + Math.sin((1 - b.pop / 0.22) * Math.PI) * 0.18 : 1;
      drawOrb(b.x, b.y, b.level, b.angle, b.squash, scale);
    }
    drawEffects();
  }
  function frame(now) {
    const delta = Math.min(0.05, (now - lastFrame) / 1000);
    lastFrame = now;
    if (!paused && !ended) {
      accumulator = Math.min(0.1, accumulator + delta);
      while (accumulator >= STEP && !ended) { simulate(STEP); accumulator -= STEP; }
    }
    render(); requestAnimationFrame(frame);
  }
  reset(); requestAnimationFrame(frame);
})();

</script>
</body>
